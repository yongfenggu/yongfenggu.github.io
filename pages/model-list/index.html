<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="使用 API URL 和 API Key 查询可调用的 OpenAI 或 Anthropic 模型。">
  <title>模型列表查询</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f2eb;
      --card: rgba(255, 255, 255, 0.82);
      --ink: #18221d;
      --muted: #68736d;
      --line: #d8ddd9;
      --accent: #176b4d;
      --accent-hover: #0f583e;
      --accent-soft: #e3f1ea;
      --danger: #a43d35;
      --danger-soft: #fae9e6;
      --shadow: 0 24px 70px rgba(37, 53, 45, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(217, 235, 225, 0.95), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(234, 218, 184, 0.72), transparent 35%),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell { width: min(720px, 100%); }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 7vw, 58px);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: .98;
    }

    .intro {
      max-width: 560px;
      margin: 18px 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .card {
      padding: clamp(22px, 5vw, 36px);
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .provider-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 24px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f2f4f2;
    }

    .provider-switch button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .provider-switch button.active {
      color: var(--ink);
      background: #fff;
      box-shadow: 0 2px 10px rgba(24, 34, 29, .08);
    }

    .field { margin-top: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, .9);
      outline: none;
      font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 77, .12);
    }

    .key-wrap { position: relative; }
    .key-wrap input { padding-right: 74px; }

    .reveal {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      border: 0;
      padding: 7px 9px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .test-button {
      width: 100%;
      margin-top: 24px;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    .test-button:hover { background: var(--accent-hover); }
    .test-button:active { transform: translateY(1px); }
    .test-button:disabled { opacity: .65; cursor: wait; }

    .privacy {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .result {
      display: none;
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .result.visible { display: block; }
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .result h2 { margin: 0; font-size: 16px; }
    .count { color: var(--muted); font-size: 13px; }

    .model-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .model-list li {
      overflow: hidden;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .74);
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .call-test {
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: var(--accent-soft);
    }

    .call-test h3 { margin: 0 0 6px; font-size: 15px; }
    .call-test p { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .call-row { display: flex; gap: 10px; }

    select {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--ink);
      background: #fff;
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }

    .call-button {
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      color: #fff;
      background: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .call-button:disabled { opacity: .6; cursor: wait; }

    .call-response {
      display: none;
      margin: 14px 0 0;
      padding: 12px;
      overflow-wrap: anywhere;
      border: 1px solid rgba(23, 107, 77, .2);
      border-radius: 10px;
      color: var(--ink);
      background: rgba(255, 255, 255, .75);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .call-response.visible { display: block; }
    .call-response.failed { color: var(--danger); border-color: #efc9c4; background: var(--danger-soft); }

    .error {
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid #efc9c4;
      border-radius: 10px;
      color: var(--danger);
      background: var(--danger-soft);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      .model-list { grid-template-columns: 1fr; }
      .call-row { flex-direction: column; }
      h1 { font-size: 42px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">API Utility</p>
    <h1>模型列表查询</h1>
    <p class="intro">输入服务地址和 API Key，查看当前凭证可以访问的模型。兼容 OpenAI 与 Anthropic 风格接口。</p>

    <section class="card" aria-label="模型查询表单">
      <div class="provider-switch" role="group" aria-label="API 类型">
        <button class="active" type="button" data-provider="openai" aria-pressed="true">OpenAI</button>
        <button type="button" data-provider="anthropic" aria-pressed="false">Anthropic</button>
      </div>

      <form id="queryForm">
        <div class="field">
          <label for="apiUrl">API URL</label>
          <input id="apiUrl" type="url" inputmode="url" placeholder="https://api.openai.com/v1" autocomplete="url" required>
        </div>

        <div class="field">
          <label for="apiKey">API Key</label>
          <div class="key-wrap">
            <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" required>
            <button class="reveal" id="revealKey" type="button" aria-label="显示 API Key">显示</button>
          </div>
        </div>

        <button class="test-button" id="testButton" type="submit">测试并获取模型</button>
        <p class="privacy">凭证只会从当前浏览器发往你填写的 API 地址，不会保存在本站。</p>
      </form>

      <div id="message" role="status" aria-live="polite"></div>
      <section class="result" id="result" aria-label="查询结果">
        <div class="result-head">
          <h2>可用模型</h2>
          <span class="count" id="modelCount"></span>
        </div>
        <ul class="model-list" id="modelList"></ul>
        <div class="call-test">
          <h3>实际调用测试</h3>
          <p>向所选模型发送“请只回复：连接成功”，验证文本生成调用是否正常。</p>
          <div class="call-row">
            <select id="modelSelect" aria-label="选择要测试的模型"></select>
            <button class="call-button" id="callButton" type="button">发起测试调用</button>
          </div>
          <div class="call-response" id="callResponse" role="status" aria-live="polite"></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const state = { provider: 'openai' };
    const form = document.getElementById('queryForm');
    const urlInput = document.getElementById('apiUrl');
    const keyInput = document.getElementById('apiKey');
    const button = document.getElementById('testButton');
    const message = document.getElementById('message');
    const result = document.getElementById('result');
    const modelList = document.getElementById('modelList');
    const modelCount = document.getElementById('modelCount');
    const modelSelect = document.getElementById('modelSelect');
    const callButton = document.getElementById('callButton');
    const callResponse = document.getElementById('callResponse');

    document.querySelectorAll('[data-provider]').forEach((providerButton) => {
      providerButton.addEventListener('click', () => {
        state.provider = providerButton.dataset.provider;
        document.querySelectorAll('[data-provider]').forEach((item) => {
          const selected = item === providerButton;
          item.classList.toggle('active', selected);
          item.setAttribute('aria-pressed', String(selected));
        });
        urlInput.placeholder = state.provider === 'openai'
          ? 'https://api.openai.com/v1'
          : 'https://api.anthropic.com/v1';
        clearOutput();
      });
    });

    document.getElementById('revealKey').addEventListener('click', (event) => {
      const showing = keyInput.type === 'text';
      keyInput.type = showing ? 'password' : 'text';
      event.currentTarget.textContent = showing ? '显示' : '隐藏';
      event.currentTarget.setAttribute('aria-label', showing ? '显示 API Key' : '隐藏 API Key');
    });

    function endpointUrl(rawUrl, endpoint) {
      const url = new URL(rawUrl.trim());
      let path = url.pathname.replace(/\/+$/, '');
      path = path.replace(/\/(models|chat\/completions|messages)$/i, '');
      if (!path || path === '/') path = '/v1';
      url.pathname = `${path}/${endpoint}`;
      url.search = '';
      url.hash = '';
      return url.toString();
    }

    function clearOutput() {
      message.innerHTML = '';
      result.classList.remove('visible');
      modelList.innerHTML = '';
      modelSelect.innerHTML = '';
      callResponse.className = 'call-response';
      callResponse.textContent = '';
    }

    function showError(text) {
      clearOutput();
      const box = document.createElement('div');
      box.className = 'error';
      box.textContent = text;
      message.appendChild(box);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearOutput();
      button.disabled = true;
      button.textContent = '正在查询…';

      try {
        const headers = state.provider === 'openai'
          ? { Authorization: `Bearer ${keyInput.value.trim()}` }
          : {
              'x-api-key': keyInput.value.trim(),
              'anthropic-version': '2023-06-01'
            };

        const response = await fetch(endpointUrl(urlInput.value, 'models'), { method: 'GET', headers });
        let payload;
        try { payload = await response.json(); }
        catch { throw new Error(`服务返回了非 JSON 内容（HTTP ${response.status}）`); }

        if (!response.ok) {
          const detail = payload?.error?.message || payload?.message || `请求失败（HTTP ${response.status}）`;
          throw new Error(detail);
        }

        const rows = Array.isArray(payload) ? payload : payload.data;
        if (!Array.isArray(rows)) throw new Error('响应中没有找到模型列表 data。请确认选择的接口类型和 URL。');

        const models = rows
          .map((item) => typeof item === 'string' ? item : item?.id || item?.name)
          .filter(Boolean)
          .sort((a, b) => a.localeCompare(b));

        if (!models.length) throw new Error('接口请求成功，但返回的模型列表为空。');

        models.forEach((model) => {
          const item = document.createElement('li');
          item.textContent = model;
          item.title = model;
          modelList.appendChild(item);

          const option = document.createElement('option');
          option.value = model;
          option.textContent = model;
          modelSelect.appendChild(option);
        });
        const preferredModel = models.find((model) => state.provider === 'openai'
          ? /^(gpt|chatgpt|o\d)/i.test(model)
          : /^claude/i.test(model));
        if (preferredModel) modelSelect.value = preferredModel;
        modelCount.textContent = `${models.length} 个`;
        result.classList.add('visible');
      } catch (error) {
        const corsHint = error instanceof TypeError
          ? '浏览器无法连接。请检查 URL、网络，以及该服务是否允许浏览器跨域访问（CORS）。'
          : error.message;
        showError(corsHint);
      } finally {
        button.disabled = false;
        button.textContent = '测试并获取模型';
      }
    });

    callButton.addEventListener('click', async () => {
      const model = modelSelect.value;
      if (!model) return;

      callButton.disabled = true;
      callButton.textContent = '调用中…';
      callResponse.className = 'call-response visible';
      callResponse.textContent = '正在等待模型响应…';
      const startedAt = performance.now();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);

      try {
        const isOpenAI = state.provider === 'openai';
        const headers = isOpenAI
          ? {
              Authorization: `Bearer ${keyInput.value.trim()}`,
              'Content-Type': 'application/json'
            }
          : {
              'x-api-key': keyInput.value.trim(),
              'anthropic-version': '2023-06-01',
              'Content-Type': 'application/json'
            };
        const body = isOpenAI
          ? {
              model,
              messages: [{ role: 'user', content: '请只回复：连接成功' }],
              max_tokens: 32
            }
          : {
              model,
              messages: [{ role: 'user', content: '请只回复：连接成功' }],
              max_tokens: 32
            };
        const endpoint = isOpenAI ? 'chat/completions' : 'messages';
        const response = await fetch(endpointUrl(urlInput.value, endpoint), {
          method: 'POST',
          headers,
          body: JSON.stringify(body),
          signal: controller.signal
        });
        let payload;
        try { payload = await response.json(); }
        catch { throw new Error(`服务返回了非 JSON 内容（HTTP ${response.status}）`); }
        if (!response.ok) {
          throw new Error(payload?.error?.message || payload?.message || `请求失败（HTTP ${response.status}）`);
        }

        const rawContent = isOpenAI ? payload?.choices?.[0]?.message?.content : payload?.content;
        const content = Array.isArray(rawContent)
          ? rawContent.map((part) => typeof part === 'string' ? part : part?.text || '').join('')
          : rawContent;
        if (!content) throw new Error('调用成功，但响应中没有找到文本内容。');

        const elapsed = ((performance.now() - startedAt) / 1000).toFixed(2);
        callResponse.textContent = `调用成功 · ${elapsed}s\n${content}`;
      } catch (error) {
        const text = error.name === 'AbortError'
          ? '调用超时（45 秒）。'
          : error instanceof TypeError
            ? '浏览器无法连接。请检查网络和服务端 CORS 设置。'
            : error.message;
        callResponse.className = 'call-response visible failed';
        callResponse.textContent = `调用失败\n${text}`;
      } finally {
        clearTimeout(timeout);
        callButton.disabled = false;
        callButton.textContent = '发起测试调用';
      }
    });
  </script>
</body>
</html>
