<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>激光对中测量系统</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- 主体：单一 3D 画面 + 左右悬浮侧栏 -->
    <div class="stage">
        <div id="view3dContainer"></div>

        <!-- 右上：设置 -->
        <button class="overlay btn icon-btn" id="settingsBtn" title="设置">⚙ 设置</button>

        <!-- 左下：颜色图例 + 切回原始视向 -->
        <div class="overlay legend" id="viewLegend">
            <div class="lg-item"><span class="lg-swatch" style="background:#d2d7dd;"></span>高压侧</div>
            <div class="lg-item"><span class="lg-swatch" style="background:#8b9199;"></span>低压侧</div>
            <div class="lg-item"><span class="lg-swatch" style="background:#1f9e89;"></span>轴向传感器</div>
            <div class="lg-item"><span class="lg-swatch" style="background:#a0522d;"></span>径向传感器</div>
            <button class="btn btn-sm" id="resetViewBtn" style="margin-top:6px;">切回原始视向</button>
        </div>

        <!-- 右侧栏：测量视图 / 方案编辑视图 (二选一) -->
        <aside class="overlay side-panel side-right">
            <!-- 测量视图 -->
            <div id="measureView">
                <div class="op-group">
                    <div class="scheme-switch">
                        <span class="ss-label">安装方案</span>
                        <select id="switchSchemeSelect" title="切换当前测量所用的安装方案"></select>
                        <button class="btn btn-icon" id="editSchemeBtn" title="编辑当前方案">✎</button>
                    </div>
                    <div class="rotate-row">
                        <button class="btn" id="rotateDirBtn" title="切换旋转方向：当前是正转">切换旋转方向</button>
                        <select id="rotateDegSelect" title="旋转角度">
                            <option value="90">90°</option>
                            <option value="180">180°</option>
                            <option value="240">240°</option>
                            <option value="270">270°</option>
                            <option value="custom">自定义…</option>
                        </select>
                        <input type="number" id="rotateDegInput" value="90" step="15" title="自定义角度(°)" style="display:none;">
                        <button class="btn btn-primary" id="rotateApplyBtn">旋转</button>
                    </div>
                    <button class="btn btn-primary" id="measureNowBtn">测量</button>
                </div>
                <div class="side-title" style="margin-top:2px;">测量结果</div>
                <div class="result-log" id="resultLog">
                    <div class="rl-empty">暂无测量记录</div>
                </div>
                <div class="op-row" style="margin-top:8px;">
                    <button class="btn btn-primary" id="calcResultBtn" disabled>计算</button>
                    <button class="btn btn-icon" id="resetBtn" title="删除全部测量记录">↺</button>
                </div>
                <div id="calcResultBox" class="calc-result-box" style="display:none;"></div>
            </div>

            <!-- 安装方案编辑视图 (新建/修改方案时显示; 此时不能测量) -->
            <div id="schemeEditView" style="display:none;">
                <div class="scheme-edit-head">
                    <div class="side-title" id="schemeEditTitle">新建安装方案</div>
                    <span class="close-btn" id="schemeEditClose" title="关闭并返回测量">&times;</span>
                </div>

                <!-- 1. 高低压缸的方向和位置 -->
                <div class="ip-block">
                    <div class="ip-label">高低压缸的方向和位置</div>
                    <div class="ip-sub">哪一侧是高压缸？</div>
                    <button class="btn" id="cylinderToggleBtn">切换高/低压缸位置</button>
                </div>

                <!-- 2. 传感器安装在哪一侧 -->
                <div class="ip-block">
                    <div class="ip-label">传感器安装在哪一侧？</div>
                    <div class="seg" id="installSideSeg">
                        <label><input type="radio" name="installSide" value="high" checked><span>高压缸侧</span></label>
                        <label><input type="radio" name="installSide" value="low"><span>低压缸侧</span></label>
                    </div>
                </div>

                <!-- 3. 每个传感器的初始方位 -->
                <div class="ip-block">
                    <div class="ip-label">每个传感器的初始方位</div>
                    <div class="ip-row">
                        <span class="ip-name" style="color:#1f9e89;">轴向传感器1</span>
                        <select class="sensor-pos" data-sensor="axial1"></select>
                    </div>
                    <div class="ip-row">
                        <span class="ip-name" style="color:#1f9e89;">轴向传感器2</span>
                        <select class="sensor-pos" data-sensor="axial2"></select>
                    </div>
                    <div class="ip-row">
                        <span class="ip-name" style="color:#a0522d;">径向传感器</span>
                        <select class="sensor-pos" data-sensor="radial"></select>
                    </div>
                </div>

                <button class="btn btn-primary" id="installApplyBtn">确认保存</button>
            </div>
        </aside>
    </div>

    <!-- 设置模态框 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">系统设置</div>
                <span class="close-btn" onclick="system.hideSettings()">&times;</span>
            </div>

            <div class="modal-body">
                <!-- 传感器连接状态 -->
                <div class="form-group">
                    <label class="form-label">传感器状态</label>
                    <div class="status-list">
                        <div class="status-item">
                            <div class="status-dot"></div>
                            <span>轴向传感器1</span>
                        </div>
                        <div class="status-item">
                            <div class="status-dot"></div>
                            <span>轴向传感器2</span>
                        </div>
                        <div class="status-item">
                            <div class="status-dot"></div>
                            <span>径向传感器</span>
                        </div>
                        <div class="status-item">
                            <span>系统时间</span>
                            <span id="currentTime">--:--:--</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">轴向传感器1 IP地址</label>
                    <input type="text" id="axial1IP" class="form-input" placeholder="192.168.10.10">
                </div>

                <div class="form-group">
                    <label class="form-label">轴向传感器2 IP地址</label>
                    <input type="text" id="axial2IP" class="form-input" placeholder="192.168.10.11">
                </div>

                <div class="form-group">
                    <label class="form-label">径向传感器 IP地址</label>
                    <input type="text" id="radialIP" class="form-input" placeholder="192.168.10.12">
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="useMockData">
                        <span style="color: #1a1a1a; font-size: 13px;">使用模拟数据</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="form-label">安装方案管理</label>
                    <div style="display:flex; gap:8px;">
                        <button class="btn" id="newSchemeBtn" style="flex:1;color:#525252;">新建安装方案</button>
                        <button class="btn" id="deleteSchemeBtn" style="flex:1;color:#525252;">删除当前方案</button>
                    </div>
                </div>

                <div class="form-group">
                    <button class="btn" id="historyToggleBtn" style="width:100%;color:#525252;">测量历史</button>
                </div>

                <div class="modal-buttons" style="margin-top: 20px;">
                    <button class="btn" onclick="system.hideSettings()" style="color: #525252;">取消</button>
                    <button class="btn btn-primary" onclick="system.saveSettings()" style="color: white;">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 测量历史弹窗 -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">测量历史</div>
                <span class="close-btn" id="closeHistoryModal">&times;</span>
            </div>
            <div class="modal-body">
                <div id="historyExportBar" style="display:none; margin-bottom:15px; padding:12px; background:#f5f5f5; border-radius:6px; border:1px solid #e5e5e5;">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                        <div style="font-size:13px; color:#525252;">
                            <span>已选 <strong id="historySelectedCount">0</strong> 项</span>
                            <button class="btn" onclick="system.historySelectAll()" style="margin-left:8px; padding:4px 10px; font-size:12px; color:#525252;">全选</button>
                            <button class="btn" onclick="system.historyDeselectAll()" style="padding:4px 10px; font-size:12px; color:#525252;">取消全选</button>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn btn-primary" onclick="system.exportHistoryPDF()" style="padding:6px 14px; font-size:12px; color:white;">导出PDF</button>
                            <button class="btn btn-primary" onclick="system.exportHistoryCSV()" style="padding:6px 14px; font-size:12px; color:white;">导出CSV</button>
                        </div>
                    </div>
                </div>
                <div id="historyList" class="history-list">
                    <div class="history-empty">暂无历史记录</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="detailTitle">测量详情</div>
                <span class="close-btn" id="closeDetailModal">&times;</span>
            </div>
            <div class="modal-body">
                <div id="detailContent"></div>
            </div>
        </div>
    </div>

    <!-- 报告模态框 -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">测量报告</div>
                <span class="close-btn" onclick="system.hideReport()">&times;</span>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">测量名称</label>
                    <input type="text" id="reportName" class="form-input">
                </div>

                <div id="reportContent"></div>

                <div class="modal-buttons" style="margin-top: 20px;">
                    <button class="btn" onclick="system.hideReport()" style="color: #525252;">关闭</button>
                    <button class="btn" onclick="system.exportPDF()" style="background:#4a7c59;color:white;border-color:#4a7c59;">导出PDF</button>
                    <button class="btn" onclick="system.exportCSV()" style="background:#2a6496;color:white;border-color:#2a6496;">导出CSV</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js 从 CDN 加载(Service Worker 会缓存, 联网一次后离线也可用); 主逻辑见 app.js -->

    <!-- html2canvas + jsPDF 库改由 ensurePdfLibraries() 在导出时动态加载(含 CDN 回退),
         Service Worker 会缓存这些 CDN 库, 联网一次后离线也可用。此处不再静态引入,
         以免请求不存在的本地文件返回 404 HTML 被当作脚本执行而破坏后续解析。 -->

    <script src="./app.js" defer></script>
    <script>
        // 离线缓存：注册 pages/ 共享 Service Worker，使断网后仍可访问本页
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then(reg => console.log('[pages-cache] SW 已注册，作用域:', reg.scope))
                    .catch(err => console.warn('[pages-cache] SW 注册失败:', err));
            });
        }
    </script>
</body>
</html>
