    <!--
      五子棋引擎：negamax + alpha-beta + 迭代加深。
      这段源码有两种跑法，共用同一份实现：
        1. http(s) 下取本 script 的文本构造 Worker，搜索不阻塞界面；
        2. file:// 下浏览器禁止用 Blob 建 Worker，就直接在主线程调用这里的函数。
      所以它写成对 self 挂载的形式，在窗口和 Worker 里都成立。
    -->
    <script id="engineSrc">
    (function (root) {
        'use strict';
        const N = 15;
        const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
        // 滑窗内同色子数对应权重，逐级拉开差距，让威胁压过零散布子的噪声
        const RUN = [0, 1, 20, 400, 9000, 10000000];
        const WIN = 10000000;

        // 以长度 5 的滑窗统计双方形状分。滑窗天然区分活四(占两窗)与冲四(占一窗)，
        // 也能算到 11011 这类跳four。必须严格零和，否则 negamax 的取反假设不成立。
        function evaluate(b, me) {
            const opp = me === 1 ? 2 : 1;
            let mineTotal = 0, oppTotal = 0;
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    for (let d = 0; d < 4; d++) {
                        const dr = DIRS[d][0], dc = DIRS[d][1];
                        const er = r + 4 * dr, ec = c + 4 * dc;
                        if (er < 0 || er >= N || ec < 0 || ec >= N) continue;
                        let mine = 0, theirs = 0;
                        for (let k = 0; k < 5; k++) {
                            const v = b[(r + k * dr) * N + (c + k * dc)];
                            if (v === me) mine++;
                            else if (v === opp) theirs++;
                        }
                        // 窗内混有双方棋子，这个窗谁都成不了五
                        if (mine > 0 && theirs > 0) continue;
                        if (mine > 0) mineTotal += RUN[mine];
                        else if (theirs > 0) oppTotal += RUN[theirs];
                    }
                }
            }
            return mineTotal - oppTotal;
        }

        // 单点落子价值，用于候选点排序；同时叠加对手在此处的价值以兼顾堵点
        function pointScore(b, r, c, who) {
            let s = 0;
            for (let d = 0; d < 4; d++) {
                const dr = DIRS[d][0], dc = DIRS[d][1];
                let run = 1, openEnds = 0, gap = 0;
                for (const sign of [1, -1]) {
                    let step = 1, blanks = 0;
                    while (step <= 4) {
                        const rr = r + sign * dr * step, cc = c + sign * dc * step;
                        if (rr < 0 || rr >= N || cc < 0 || cc >= N) break;
                        const v = b[rr * N + cc];
                        if (v === who) { run++; if (blanks) gap++; }
                        else if (v === 0) { if (blanks) break; blanks = 1; openEnds++; }
                        else break;
                        step++;
                    }
                }
                if (run >= 5) return WIN;
                s += RUN[Math.min(run, 5)] * (openEnds === 2 ? 2.2 : openEnds === 1 ? 1 : 0.25);
                if (gap) s += RUN[Math.min(run, 5)] * 0.4;
            }
            return s;
        }

        function isWin(b, r, c, who) {
            for (let d = 0; d < 4; d++) {
                const dr = DIRS[d][0], dc = DIRS[d][1];
                let run = 1;
                for (const sign of [1, -1]) {
                    let step = 1;
                    while (step <= 4) {
                        const rr = r + sign * dr * step, cc = c + sign * dc * step;
                        if (rr < 0 || rr >= N || cc < 0 || cc >= N) break;
                        if (b[rr * N + cc] !== who) break;
                        run++; step++;
                    }
                }
                if (run >= 5) return true;
            }
            return false;
        }

        // 只在已有棋子半径 2 内取候选点，并按攻防合计分排序后截断
        function genMoves(b, who, limit) {
            const opp = who === 1 ? 2 : 1;
            const out = [];
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (b[r * N + c] !== 0) continue;
                    let near = false;
                    for (let dr = -2; dr <= 2 && !near; dr++) {
                        for (let dc = -2; dc <= 2; dc++) {
                            const rr = r + dr, cc = c + dc;
                            if (rr >= 0 && rr < N && cc >= 0 && cc < N && b[rr * N + cc] !== 0) { near = true; break; }
                        }
                    }
                    if (!near) continue;
                    const s = pointScore(b, r, c, who) + pointScore(b, r, c, opp) * 0.9;
                    out.push({ r: r, c: c, s: s });
                }
            }
            out.sort((x, y) => y.s - x.s);
            return out.slice(0, limit);
        }

        let deadline = 0;
        let aborted = false;
        let minBranch = 6;   // 深层收窄的下限，由档位设定

        function negamax(b, who, depth, alpha, beta, branch) {
            if (Date.now() > deadline) { aborted = true; return evaluate(b, who); }
            if (depth === 0) return evaluate(b, who);

            const moves = genMoves(b, who, branch);
            if (moves.length === 0) return evaluate(b, who);

            let best = -Infinity;
            for (let i = 0; i < moves.length; i++) {
                const m = moves[i];
                const idx = m.r * N + m.c;
                b[idx] = who;
                let val;
                if (isWin(b, m.r, m.c, who)) {
                    // 越早赢分越高，避免拖沓
                    val = WIN + depth;
                } else {
                    // 深层收窄分支但不低于 minBranch：这个下限太小，防守方就找不到正确堵点，
                    // 会把本可防的攻击误判成必胜，胜率也随之乱跳。实测它比搜索深度更影响棋力。
                    val = -negamax(b, who === 1 ? 2 : 1, depth - 1, -beta, -alpha, Math.max(minBranch, branch - 2));
                }
                b[idx] = 0;
                if (val > best) best = val;
                if (best > alpha) alpha = best;
                if (alpha >= beta) break;
                if (aborted) break;
            }
            return best;
        }

        // 迭代加深搜索，返回最佳点与站在 who 视角的分数
        function search(b, who, maxDepth, branch, timeMs, minBr) {
            deadline = Date.now() + timeMs;
            aborted = false;
            minBranch = minBr || 6;

            const roots = genMoves(b, who, branch);
            if (roots.length === 0) {
                const mid = (N - 1) / 2 | 0;
                return { move: { r: mid, c: mid }, score: 0, depth: 0 };
            }

            // 己方能立即成五，或必须堵对手的五，直接定夺不必深搜
            for (const m of roots) {
                b[m.r * N + m.c] = who;
                const w = isWin(b, m.r, m.c, who);
                b[m.r * N + m.c] = 0;
                if (w) return { move: m, score: WIN, depth: 1 };
            }
            // 堵对手成五点不做捷径：搜索本身就会发现不堵即负，
            // 若在此提前返回静态评估分，会和搜索分不同尺度，导致胜率跳变
            const opp = who === 1 ? 2 : 1;

            let bestMove = roots[0], bestScore = -Infinity, reached = 0;
            for (let d = 2; d <= maxDepth; d += 2) {
                let localBest = -Infinity, localMove = null;
                let alpha = -Infinity;
                for (const m of roots) {
                    const idx = m.r * N + m.c;
                    b[idx] = who;
                    const val = -negamax(b, opp, d - 1, -Infinity, -alpha, branch);
                    b[idx] = 0;
                    if (val > localBest) { localBest = val; localMove = m; }
                    if (val > alpha) alpha = val;
                    if (aborted) break;
                }
                // 本层被时间打断则丢弃该层结果，保留上一层的完整结论
                if (aborted && localMove === null) break;
                if (!aborted) { bestMove = localMove; bestScore = localBest; reached = d; }
                if (aborted) break;
                if (bestScore >= WIN) break;
            }

            if (bestScore === -Infinity) { bestScore = evaluate(b, who); reached = 0; }
            return { move: bestMove, score: bestScore, depth: reached };
        }

        // 评估分 -> 胜率。尺度 15000 是实测选的：五子棋里"轮到谁走"本身值约 8500 分，
        // 尺度太小会让这点先手优势把数字顶到两端，每手在 0/100 之间翻烧饼。
        // 搜到必胜/必败时直接给极值，不受尺度影响。
        function toWinrate(score) {
            if (score >= WIN) return 1;
            if (score <= -WIN) return 0;
            const p = 1 / (1 + Math.exp(-score / 15000));
            return Math.min(0.99, Math.max(0.01, p));
        }

        // 档位参数经对局实测标定（各档互相对下，每组 6~8 局）：
        //   宽度(branch/minBr)比深度(depth)更能提升棋力——加深到 8 层对胜负几无影响，
        //   而把 branch 从 11 加到 16 能以 5:1 胜过原配置。原因是深层分支太窄时防守方
        //   找不到正确堵点。depth 只是上限，真正卡住搜索的是 time。
        const LEVELS = {
            easy:   { depth: 2, branch: 8,  minBr: 6,  time: 300 },
            medium: { depth: 4, branch: 11, minBr: 8,  time: 800 },
            hard:   { depth: 6, branch: 16, minBr: 10, time: 2000 }
        };
        // 胜率分析用固定档位：显示的数字必须前后可比，不能随 AI 棋力变化
        const ANALYZE = { depth: 6, branch: 11, minBr: 6, time: 800 };

        // 处理一次请求，返回结果对象。Worker 和主线程走同一个入口。
        function handle(msg) {
            const b = Int8Array.from(msg.board);
            const t0 = Date.now();

            if (msg.type === 'move') {
                const cfg = LEVELS[msg.level] || LEVELS.medium;
                // 主线程模式会传入更小的 budget，防止长时间搜索把界面卡住
                const budget = msg.budget ? Math.min(cfg.time, msg.budget) : cfg.time;
                const res = search(b, msg.player, cfg.depth, cfg.branch, budget, cfg.minBr);
                return {
                    type: 'move', id: msg.id, row: res.move.r, col: res.move.c,
                    winrate: toWinrate(res.score), depth: res.depth, ms: Date.now() - t0
                };
            }
            if (msg.type === 'analyze') {
                // 主线程模式下用更短的时限，避免点一下卡住界面
                const budget = msg.budget || ANALYZE.time;
                const res = search(b, msg.player, ANALYZE.depth, ANALYZE.branch, budget, ANALYZE.minBr);
                return {
                    type: 'analyze', id: msg.id, player: msg.player,
                    winrate: toWinrate(res.score), depth: res.depth, ms: Date.now() - t0
                };
            }
            return null;
        }

        root.GobangEngine = { handle: handle, search: search, evaluate: evaluate, toWinrate: toWinrate, LEVELS: LEVELS };

        // 用 importScripts 区分身份：Worker 里才有它。window 上也有 postMessage，
        // 单看 postMessage 会误判，把页面自己的 message 事件也接过来。
        if (typeof root.postMessage === 'function' && typeof root.importScripts === 'function') {
            root.onmessage = function (e) {
                const out = handle(e.data);
                if (out) root.postMessage(out);
            };
        }
    })(typeof self !== 'undefined' ? self : this);
    </script>

    <script>
        const BOARD_SIZE = 15;
        const CELL_SIZE = calculateCellSize();
        const PADDING = CELL_SIZE * 1.2;
        const CANVAS_SIZE = (BOARD_SIZE - 1) * CELL_SIZE + 2 * PADDING;
        const PIECE_RADIUS = CELL_SIZE * 0.42;

        const canvas = document.getElementById('gameBoard');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;

        // 设置高清 canvas
        canvas.width = CANVAS_SIZE * dpr;
        canvas.height = CANVAS_SIZE * dpr;
        canvas.style.width = CANVAS_SIZE + 'px';
        canvas.style.height = CANVAS_SIZE + 'px';
        ctx.scale(dpr, dpr);

        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let currentPlayer = 1; // 1 for black, 2 for white
        let gameOver = false;
        let moveHistory = [];
        let currentGameId = null;
        let gameStartTime = Date.now();
        let isReplayMode = false;
        let replayStep = 0;
        let player1Name = '';
        let player2Name = '';
        let blackPlayer = 1; // 1 表示玩家一是黑方，2 表示玩家二是黑方
        let pendingBlackPlayer = 1; // 设置里选的先手，对局中不立即生效，开新局时才应用
        let isHistoryGame = false; // 标记是否从历史记录加载的游戏
        let autoPlayTimer = null; // 自动播放定时器
        let player1IsAI = false; // 玩家一是否为 AI
        let player2IsAI = false; // 玩家二是否为 AI
        let aiThinkingTimer = null; // AI 思考定时器

        // ========== 引擎与设置 ==========
        let showWinrate = true;       // 是否显示实时胜率，默认开
        let aiLevel = 'medium';       // AI 棋力档位
        let engine = null;            // Worker 实例
        let reqSeq = 0;               // 请求序号，用于丢弃过期结果
        let analyzeReqId = 0;         // 当前有效的胜率请求
        let moveReqId = 0;            // 当前有效的 AI 落子请求

        let engineMode = 'none';   // 'worker' | 'inline' | 'none'

        // 准备引擎。优先用 Worker（搜索不占用界面线程）；
        // file:// 下浏览器禁止 Blob Worker，退回主线程同步调用同一套引擎。
        function initEngine() {
            if (engineMode !== 'none') return true;

            // 先试 Worker
            try {
                const src = document.getElementById('engineSrc').textContent;
                const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
                const w = new Worker(url);
                URL.revokeObjectURL(url);
                w.onmessage = onEngineMessage;
                w.onerror = (ev) => {
                    // 关键：某些浏览器（含 file:// 下的 Chrome）建 Worker 时不同步报错，
                    // 而是稍后才触发这里。此时已经发出的请求会静默丢失，必须切模式后重发，
                    // 否则表现就是 AI 不落子、胜率一直空着。
                    if (ev && ev.preventDefault) ev.preventDefault();
                    console.warn('[engine] Worker 不可用，改用主线程模式');
                    try { w.terminate(); } catch (e) {}
                    engine = null;
                    engineMode = window.GobangEngine ? 'inline' : 'none';

                    const pending = pendingMsg;
                    pendingMsg = null;
                    if (pending && engineMode === 'inline') engineRequest(pending);
                };
                engine = w;
                engineMode = 'worker';
                return true;
            } catch (err) {
                console.warn('[engine] 无法建立 Worker（file:// 下属正常），改用主线程模式');
            }

            // 退回主线程：引擎脚本已在本页执行过，直接用全局对象
            if (window.GobangEngine) {
                engine = null;
                engineMode = 'inline';
                return true;
            }
            return false;
        }

        // 主线程模式下的时限：搜索会阻塞界面，所以比 Worker 模式收紧。
        // move 给到 1200ms 是因为高级档搜满 6 层约需 700ms，压到 600 会退化成 4 层；
        // AI 思考时短暂卡顿可以接受。analyze 每手都触发，卡顿更扰人，压到 350ms——
        // 实测它和 800ms 的胜率差异在 1% 内，不影响显示。
        const INLINE_BUDGET = { move: 1200, analyze: 350 };
        let pendingMsg = null;     // 最近一次发给 Worker 的请求，供切换模式后重发
        let watchdog = null;       // Worker 无响应的超时兜底

        // 统一的请求出口，屏蔽 Worker / 主线程的差异
        function engineRequest(msg) {
            if (!initEngine()) return false;
            if (engineMode === 'worker') {
                pendingMsg = msg;
                engine.postMessage(msg);

                // 看门狗：Worker 有时既不回消息也不报错（脚本在里面没跑起来），
                // 超时就判定不可用，切主线程重算，避免 AI 永久卡住
                clearTimeout(watchdog);
                watchdog = setTimeout(() => {
                    if (!pendingMsg) return;
                    console.warn('[engine] Worker 无响应，改用主线程模式');
                    try { engine.terminate(); } catch (e) {}
                    engine = null;
                    engineMode = window.GobangEngine ? 'inline' : 'none';
                    const p = pendingMsg;
                    pendingMsg = null;
                    if (p && engineMode === 'inline') engineRequest(p);
                }, 6000);
                return true;
            }
            // initEngine 之后才知道是不是主线程模式，这里才补上时限
            msg.budget = INLINE_BUDGET[msg.type];
            // 主线程模式：让出一帧再算，好让"思考中"这类提示能先画出来
            setTimeout(() => {
                try {
                    const out = window.GobangEngine.handle(msg);
                    if (out) onEngineMessage({ data: out });
                } catch (err) {
                    console.warn('[engine] 主线程计算失败:', err);
                }
            }, 20);
            return true;
        }

        // 棋盘转成一维数组传给 Worker
        function flatBoard() {
            const flat = new Array(BOARD_SIZE * BOARD_SIZE);
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) flat[r * BOARD_SIZE + c] = board[r][c];
            }
            return flat;
        }

        function onEngineMessage(e) {
            const d = e.data;
            pendingMsg = null;          // 已有回复，无需再重发
            clearTimeout(watchdog);     // 也就不用再等看门狗
            if (d.type === 'analyze') {
                if (d.id !== analyzeReqId) return; // 过期结果直接丢弃
                // 引擎返回的是「当前行棋方」的胜率，统一换算成黑方视角
                const blackWr = d.player === 1 ? d.winrate : 1 - d.winrate;
                renderWinrate(blackWr, `搜索 ${d.depth} 层 · ${d.ms}ms`);
            } else if (d.type === 'move') {
                if (d.id !== moveReqId) return;
                applyAIMove(d.row, d.col);
            }
        }

        // 请求胜率：由当前行棋方视角评估
        function requestWinrate() {
            if (!showWinrate || isReplayMode || gameOver) return;
            if (moveHistory.length === 0) { renderWinrate(0.5, '开局均势'); return; }

            analyzeReqId = ++reqSeq;
            setWinrateMeta('计算中…', true);
            const ok = engineRequest({
                type: 'analyze', id: analyzeReqId,
                board: flatBoard(), player: currentPlayer
            });
            if (!ok) setWinrateMeta('引擎不可用', false);
        }

        function renderWinrate(blackWr, meta) {
            const bPct = blackWr * 100;
            const wPct = 100 - bPct;
            document.getElementById('wrBlackNum').textContent = bPct.toFixed(1) + '%';
            document.getElementById('wrWhiteNum').textContent = wPct.toFixed(1) + '%';
            document.getElementById('wrFillBlack').style.width = bPct + '%';
            document.getElementById('wrFillWhite').style.width = wPct + '%';
            if (meta !== undefined) setWinrateMeta(meta, false);
        }

        function setWinrateMeta(text, thinking) {
            const el = document.getElementById('wrMeta');
            el.textContent = text;
            el.className = 'winrate-meta' + (thinking ? ' thinking' : '');
        }

        // 同步胜率面板的显示状态与双方名字
        function updateWinratePanel() {
            const panel = document.getElementById('winratePanel');
            // 回放时不显示胜率，避免和历史局面对不上
            panel.classList.toggle('active', showWinrate && !isReplayMode);
            const names = getPlayerNames();
            document.getElementById('wrBlackName').textContent = names.blackName || '黑方';
            document.getElementById('wrWhiteName').textContent = names.whiteName || '白方';
        }

        function resetWinrate() {
            renderWinrate(0.5, moveHistory.length === 0 ? '开局均势' : '');
        }

        // ========== 设置弹窗 ==========
        function loadSettings() {
            try {
                const raw = localStorage.getItem('gobang_settings');
                if (raw) {
                    const s = JSON.parse(raw);
                    // 存过设置才覆盖默认值，没存过就保持默认开启
                    if (typeof s.showWinrate === 'boolean') showWinrate = s.showWinrate;
                    if (s.aiLevel && ['easy', 'medium', 'hard'].includes(s.aiLevel)) aiLevel = s.aiLevel;
                }
            } catch (e) { /* 用默认值 */ }
        }

        function saveSettings() {
            localStorage.setItem('gobang_settings', JSON.stringify({
                showWinrate: showWinrate, aiLevel: aiLevel
            }));
        }

        function showSettings() {
            syncSettingsForm();
            document.getElementById('settingsModal').classList.add('show');
        }

        // 把当前状态写进设置表单。任何一项改动后都重新调一次，保证联动的文案同步
        function syncSettingsForm() {
            document.getElementById('setShowWinrate').checked = showWinrate;
            document.querySelector(`input[name="setRole1"][value="${player1IsAI ? 'ai' : 'human'}"]`).checked = true;
            document.querySelector(`input[name="setRole2"][value="${player2IsAI ? 'ai' : 'human'}"]`).checked = true;
            document.querySelector(`input[name="setLevel"][value="${aiLevel}"]`).checked = true;
            // 先手显示待生效值：对局中改了先手，表单要反映用户的选择而非当前局的实际值
            document.querySelector(`input[name="setBlack"][value="${pendingBlackPlayer}"]`).checked = true;

            // AI 一方的名字由程序给定，输入框置灰
            const n1 = document.getElementById('setPlayer1Name');
            const n2 = document.getElementById('setPlayer2Name');
            n1.value = player1Name || '';
            n2.value = player2Name || '';
            n1.disabled = player1IsAI;
            n2.disabled = player2IsAI;

            // 提示当前执黑执白，避免搞混先后手
            document.getElementById('setPlayer1Hint').textContent = blackPlayer === 1 ? '执黑先手' : '执白后手';
            document.getElementById('setPlayer2Hint').textContent = blackPlayer === 2 ? '执黑先手' : '执白后手';

            // 先手选项上显示真实姓名
            document.getElementById('setBlackLabel1').textContent = player1Name || '玩家一';
            document.getElementById('setBlackLabel2').textContent = player2Name || '玩家二';
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function onToggleWinrate() {
            showWinrate = document.getElementById('setShowWinrate').checked;
            saveSettings();
            updateWinratePanel();
            if (showWinrate) { resetWinrate(); requestWinrate(); }
        }

        function onChangeRole(playerNum, role) {
            const isAI = role === 'ai';
            if (playerNum === 1) player1IsAI = isAI; else player2IsAI = isAI;

            // 名字为空会被 checkPlayerNames 挡住落子，这里把缺的补上：
            // 转成 AI 的一方给机器人名，另一方若还没填也给个默认名，保证设置完就能直接下
            const DEFAULT_HUMAN = ['玩家一', '玩家二'];
            const ROBOT = ['机器人一', '机器人二'];
            if (isAI) {
                const cur = playerNum === 1 ? player1Name : player2Name;
                if (!cur || DEFAULT_HUMAN.includes(cur)) {
                    if (playerNum === 1) player1Name = ROBOT[0]; else player2Name = ROBOT[1];
                }
            } else {
                // 从 AI 切回真人时，把机器人名清成默认真人名
                const cur = playerNum === 1 ? player1Name : player2Name;
                if (ROBOT.includes(cur)) {
                    if (playerNum === 1) player1Name = DEFAULT_HUMAN[0]; else player2Name = DEFAULT_HUMAN[1];
                }
            }
            if (!player1Name) player1Name = player1IsAI ? ROBOT[0] : DEFAULT_HUMAN[0];
            if (!player2Name) player2Name = player2IsAI ? ROBOT[1] : DEFAULT_HUMAN[1];

            savePlayerNames();
            saveCurrentGame();
            updatePlayerDisplay();
            updateWinratePanel();
            syncSettingsForm();

            // 若切换后轮到 AI 行棋，立刻接手
            makeAIMove();
        }

        // 改姓名：即时生效，空值不写入，等失焦或下次同步时再补默认名
        function onChangeName(playerNum) {
            const v = document.getElementById(`setPlayer${playerNum}Name`).value.trim();
            if (playerNum === 1) player1Name = v; else player2Name = v;

            savePlayerNames();
            saveCurrentGame();
            updatePlayerDisplay();
            updateWinratePanel();

            // 只刷新依赖姓名的文案，不整体重置表单，否则输入框光标会跳
            document.getElementById('setBlackLabel1').textContent = player1Name || '玩家一';
            document.getElementById('setBlackLabel2').textContent = player2Name || '玩家二';
        }

        // 改先手。中途改 blackPlayer 会让已落子的黑白归属翻转、名字对不上棋子，
        // 所以对局进行中只记到 pendingBlackPlayer，等开新局时才应用；空盘则立即生效。
        function onChangeBlack(n) {
            pendingBlackPlayer = n;

            if (moveHistory.length === 0) {
                blackPlayer = n;
                savePlayerNames();
                saveCurrentGame();
                updatePlayerDisplay();
                updateWinratePanel();
                syncSettingsForm();
                makeAIMove();
            } else {
                savePlayerNames();
                syncSettingsForm();
                setWinrateMeta('先手改动将在下一局生效', false);
            }
        }

        function onChangeLevel(level) {
            aiLevel = level;
            saveSettings();
        }

        // 把玩家名字与 AI 身份写回 localStorage，供下次开局复用
        function savePlayerNames() {
            localStorage.setItem('gobang_player_names', JSON.stringify({
                player1Name: player1Name, player2Name: player2Name,
                blackPlayer: blackPlayer,
                player1IsAI: player1IsAI, player2IsAI: player2IsAI
            }));
        }

        // 生成唯一 ID
        function generateUniqueId() {
            return `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        }

        // 获取黑方和白方的名字
        function getPlayerNames() {
            return {
                blackName: blackPlayer === 1 ? player1Name : player2Name,
                whiteName: blackPlayer === 1 ? player2Name : player1Name
            };
        }

        // 姓名缺失时引导去设置里补，落子前调用
        function checkPlayerNames() {
            if (!player1Name || !player2Name) {
                showSettings();
                return false;
            }
            return true;
        }

        // 「新局」按钮：直接开一局，配置一律沿用设置里的值。
        // 下过棋则先确认，避免手滑丢掉进行中的对局。
        function startNewGame() {
            if (moveHistory.length > 0 && !gameOver && !isReplayMode) {
                if (!confirm('当前对局尚未结束，确定要重新开局吗？')) return;
            }

            // 姓名缺失就先补全，否则落子会被 checkPlayerNames 拦住
            fillMissingNames();

            // 应用设置里选的先手
            blackPlayer = pendingBlackPlayer;
            savePlayerNames();

            restartGame();

            // 黑方是 AI 就让它先走
            if (isCurrentPlayerAI()) setTimeout(makeAIMove, 400);
        }

        // 补齐空缺的姓名：AI 用机器人名，真人用默认名
        function fillMissingNames() {
            if (!player1Name) player1Name = player1IsAI ? '机器人一' : '玩家一';
            if (!player2Name) player2Name = player2IsAI ? '机器人二' : '玩家二';
        }

        function calculateCellSize() {
            const isMobile = window.innerWidth <= 768;
            const padding = isMobile ? 20 : 40;
            const maxWidth = Math.min(window.innerWidth - padding, isMobile ? 400 : 600);
            return Math.floor(maxWidth / (BOARD_SIZE + 1));
        }

        function drawBoard() {
            // 木纹背景渐变
            const woodGradient = ctx.createLinearGradient(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            woodGradient.addColorStop(0, '#d4a574');
            woodGradient.addColorStop(0.5, '#c9a068');
            woodGradient.addColorStop(1, '#c49a6c');
            ctx.fillStyle = woodGradient;
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // 绘制木纹纹理
            ctx.globalAlpha = 0.08;
            for (let i = 0; i < 50; i++) {
                ctx.strokeStyle = Math.random() > 0.5 ? '#8b7355' : '#a0826d';
                ctx.lineWidth = Math.random() * 1.5;
                ctx.beginPath();
                ctx.moveTo(0, Math.random() * CANVAS_SIZE);
                ctx.lineTo(CANVAS_SIZE, Math.random() * CANVAS_SIZE);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // 绘制网格线（更粗更清晰）
            ctx.strokeStyle = '#2c1810';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            const boardEnd = PADDING + (BOARD_SIZE - 1) * CELL_SIZE;

            for (let i = 0; i < BOARD_SIZE; i++) {
                // 横线
                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
                ctx.lineTo(boardEnd, PADDING + i * CELL_SIZE);
                ctx.stroke();

                // 竖线
                ctx.beginPath();
                ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
                ctx.lineTo(PADDING + i * CELL_SIZE, boardEnd);
                ctx.stroke();
            }

            // 绘制边框加粗
            ctx.strokeStyle = '#2c1810';
            ctx.lineWidth = 3;
            ctx.strokeRect(PADDING - 1.5, PADDING - 1.5, boardEnd - PADDING + 3, boardEnd - PADDING + 3);

            // 绘制天元和星位（更大更明显）
            const starPoints = [
                [3, 3], [3, 11], [11, 3], [11, 11], [7, 7]
            ];

            ctx.fillStyle = '#2c1810';
            starPoints.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, 5, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        function drawPiece(row, col, player) {
            const x = PADDING + col * CELL_SIZE;
            const y = PADDING + row * CELL_SIZE;

            // 绘制棋子阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            // 绘制棋子
            ctx.beginPath();
            ctx.arc(x, y, PIECE_RADIUS, 0, 2 * Math.PI);

            if (player === 1) {
                // 黑棋 - 更强的立体感
                const gradient = ctx.createRadialGradient(x - PIECE_RADIUS * 0.3, y - PIECE_RADIUS * 0.3, 0, x, y, PIECE_RADIUS);
                gradient.addColorStop(0, '#4a4a4a');
                gradient.addColorStop(0.5, '#1a1a1a');
                gradient.addColorStop(1, '#000');
                ctx.fillStyle = gradient;
                ctx.fill();

                // 黑棋高光
                ctx.shadowColor = 'transparent';
                const highlight = ctx.createRadialGradient(x - PIECE_RADIUS * 0.4, y - PIECE_RADIUS * 0.4, 0, x - PIECE_RADIUS * 0.4, y - PIECE_RADIUS * 0.4, PIECE_RADIUS * 0.5);
                highlight.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                highlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = highlight;
                ctx.beginPath();
                ctx.arc(x, y, PIECE_RADIUS, 0, 2 * Math.PI);
                ctx.fill();
            } else {
                // 白棋 - 更强的立体感
                const gradient = ctx.createRadialGradient(x - PIECE_RADIUS * 0.3, y - PIECE_RADIUS * 0.3, 0, x, y, PIECE_RADIUS);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.6, '#f5f5f5');
                gradient.addColorStop(1, '#d0d0d0');
                ctx.fillStyle = gradient;
                ctx.fill();

                // 白棋边框
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 白棋高光
                const highlight = ctx.createRadialGradient(x - PIECE_RADIUS * 0.4, y - PIECE_RADIUS * 0.4, 0, x - PIECE_RADIUS * 0.4, y - PIECE_RADIUS * 0.4, PIECE_RADIUS * 0.4);
                highlight.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                highlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = highlight;
                ctx.beginPath();
                ctx.arc(x - PIECE_RADIUS * 0.2, y - PIECE_RADIUS * 0.2, PIECE_RADIUS * 0.3, 0, 2 * Math.PI);
                ctx.fill();
            }

            // 重置阴影
            ctx.shadowColor = 'transparent';
        }

        function redrawBoard() {
            drawBoard();
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] !== 0) {
                        drawPiece(i, j, board[i][j]);
                    }
                }
            }
        }

        function checkWin(row, col, player) {
            const directions = [
                [[0, 1], [0, -1]],   // 横
                [[1, 0], [-1, 0]],   // 竖
                [[1, 1], [-1, -1]],  // 斜 \
                [[1, -1], [-1, 1]]   // 斜 /
            ];

            for (let direction of directions) {
                let count = 1;

                for (let [dx, dy] of direction) {
                    let newRow = row + dx;
                    let newCol = col + dy;

                    while (
                        newRow >= 0 && newRow < BOARD_SIZE &&
                        newCol >= 0 && newCol < BOARD_SIZE &&
                        board[newRow][newCol] === player
                    ) {
                        count++;
                        newRow += dx;
                        newCol += dy;
                    }
                }

                if (count >= 5) {
                    return true;
                }
            }

            return false;
        }

        // ========== AI 相关函数 ==========

        // 检查某个位置在某个方向上的连续棋子数
        function countLine(row, col, player, dx, dy) {
            let count = 0;
            let r = row;
            let c = col;

            while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
                count++;
                r += dx;
                c += dy;
            }

            return count;
        }

        // 评估某个位置的分数
        function evaluatePosition(row, col, player) {
            if (board[row][col] !== 0) return -1;

            const opponent = player === 1 ? 2 : 1;
            let score = 0;

            const directions = [
                [0, 1],   // 横
                [1, 0],   // 竖
                [1, 1],   // 斜 \
                [1, -1]   // 斜 /
            ];

            for (let [dx, dy] of directions) {
                // 检查自己的连线
                const myCount = countLine(row, col, player, dx, dy) + countLine(row, col, player, -dx, -dy) - 1;

                // 检查对手的连线
                const oppCount = countLine(row, col, opponent, dx, dy) + countLine(row, col, opponent, -dx, -dy) - 1;

                // 评分策略
                if (myCount >= 5) score += 100000; // 能赢
                else if (oppCount >= 5) score += 50000; // 必须防守
                else if (myCount === 4) score += 10000; // 四连
                else if (oppCount === 4) score += 8000; // 防四连
                else if (myCount === 3) score += 1000; // 三连
                else if (oppCount === 3) score += 800; // 防三连
                else if (myCount === 2) score += 100; // 二连
                else if (oppCount === 2) score += 50; // 防二连
                else score += 10;
            }

            // 中心位置加分
            const center = Math.floor(BOARD_SIZE / 2);
            const distanceFromCenter = Math.abs(row - center) + Math.abs(col - center);
            score += (BOARD_SIZE - distanceFromCenter) * 5;

            return score;
        }

        // AI 选择最佳位置
        function getAIMove(player) {
            let bestScore = -1;
            let bestMoves = [];

            // 遍历棋盘，找出所有可能的位置
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0) {
                        // 只考虑已有棋子附近的位置（优化性能）
                        let hasNearby = false;
                        for (let di = -2; di <= 2; di++) {
                            for (let dj = -2; dj <= 2; dj++) {
                                const ni = i + di;
                                const nj = j + dj;
                                if (ni >= 0 && ni < BOARD_SIZE && nj >= 0 && nj < BOARD_SIZE && board[ni][nj] !== 0) {
                                    hasNearby = true;
                                    break;
                                }
                            }
                            if (hasNearby) break;
                        }

                        // 如果是第一步，或者附近有棋子，才评估这个位置
                        if (moveHistory.length === 0 || hasNearby) {
                            const score = evaluatePosition(i, j, player);

                            if (score > bestScore) {
                                bestScore = score;
                                bestMoves = [{row: i, col: j}];
                            } else if (score === bestScore) {
                                bestMoves.push({row: i, col: j});
                            }
                        }
                    }
                }
            }

            // 从最佳位置中随机选一个（增加不确定性）
            if (bestMoves.length > 0) {
                return bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            // 如果没有找到，返回中心位置
            const center = Math.floor(BOARD_SIZE / 2);
            return {row: center, col: center};
        }

        // 判断某一方（1/2 指玩家一/玩家二）此刻是否轮到 AI
        function isCurrentPlayerAI() {
            const currentPlayerNum = (currentPlayer === 1 && blackPlayer === 1) || (currentPlayer === 2 && blackPlayer === 2) ? 1 : 2;
            return currentPlayerNum === 1 ? player1IsAI : player2IsAI;
        }

        // AI 下棋：优先用引擎搜索，Worker 不可用时回退到原有的单步启发式
        function makeAIMove() {
            if (gameOver || isReplayMode) return;
            if (!isCurrentPlayerAI()) return;

            moveReqId = ++reqSeq;
            if (showWinrate) setWinrateMeta('AI 思考中…', true);
            const ok = engineRequest({
                type: 'move', id: moveReqId,
                board: flatBoard(), player: currentPlayer, level: aiLevel
            });
            if (ok) return;

            // 引擎彻底不可用时才用原来的单步启发式兜底
            aiThinkingTimer = setTimeout(() => {
                const move = getAIMove(currentPlayer);
                if (move && board[move.row][move.col] === 0) applyAIMove(move.row, move.col);
            }, 500);
        }

        // 落下 AI 给出的一手，并推进对局状态
        function applyAIMove(row, col) {
            if (gameOver || isReplayMode) return;
            if (!isCurrentPlayerAI()) return;
            if (row == null || col == null || board[row][col] !== 0) return;

            moveHistory.push({ row: row, col: col, player: currentPlayer });
            document.getElementById('undoBtn').disabled = false;

            board[row][col] = currentPlayer;
            drawPiece(row, col, currentPlayer);

            if (checkWin(row, col, currentPlayer)) {
                gameOver = true;
                const names = getPlayerNames();
                const winnerName = currentPlayer === 1 ? names.blackName : names.whiteName;
                if (showWinrate) renderWinrate(currentPlayer === 1 ? 1 : 0, '对局结束');
                saveToHistory();
                showWinModal(winnerName);
                return;
            }

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updatePlayerDisplay();
            saveCurrentGame();

            // 胜率一律由 analyze 档位算，不复用 AI 落子的搜索分：
            // 两者档位不同、分数尺度不同，混用会让相邻两手的数字没法比较
            requestWinrate();

            if (isCurrentPlayerAI()) setTimeout(makeAIMove, 300);
        }

        // ========== AI 相关函数结束 ==========

        function updatePlayerDisplay() {
            const playerDot = document.getElementById('currentPlayerDot');
            const playerText = document.getElementById('currentPlayerText');

            const names = getPlayerNames();

            if (currentPlayer === 1) {
                playerDot.className = 'player-dot black';
                playerText.textContent = names.blackName || '黑方';
            } else {
                playerDot.className = 'player-dot white';
                playerText.textContent = names.whiteName || '白方';
            }
        }

        // 回放：上一步
        function replayPrev() {
            if (replayStep <= 0) return;

            stopAutoPlay(); // 停止自动播放

            replayStep--;
            const move = moveHistory[replayStep];
            board[move.row][move.col] = 0;

            currentPlayer = move.player;
            redrawBoard();
            updatePlayerDisplay();
            updateReplayButtons();
        }

        // 回放：下一步
        function replayNext() {
            if (replayStep >= moveHistory.length) return;

            const move = moveHistory[replayStep];
            board[move.row][move.col] = move.player;
            replayStep++;

            currentPlayer = replayStep % 2 === 0 ? 1 : 2; // 黑方永远先手
            redrawBoard();
            updatePlayerDisplay();
            updateReplayButtons();

            // 如果播放完了，停止自动播放
            if (replayStep >= moveHistory.length) {
                stopAutoPlay();
            }
        }

        // 更新回放按钮状态
        function updateReplayButtons() {
            document.getElementById('prevBtn').disabled = replayStep <= 0;
            document.getElementById('nextBtn').disabled = replayStep >= moveHistory.length;
            document.getElementById('replayStep').textContent = `${replayStep}/${moveHistory.length}`;
        }

        // 自动播放
        function toggleAutoPlay() {
            if (autoPlayTimer) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            if (replayStep >= moveHistory.length) {
                // 如果已经到最后，从头开始
                replayStep = 0;
                board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
                redrawBoard();
            }

            document.getElementById('autoPlayBtn').textContent = '⏸ 暂停';

            autoPlayTimer = setInterval(() => {
                if (replayStep < moveHistory.length) {
                    replayNext();
                } else {
                    stopAutoPlay();
                }
            }, 800); // 每800ms播放一步
        }

        function stopAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
                document.getElementById('autoPlayBtn').textContent = '▶ 播放';
            }
        }

        // 继续对局（从当前回放位置）
        function continueGame() {
            if (!confirm('确定要从当前位置继续对局吗？这将创建一个新的分支。')) {
                return;
            }

            // 截断历史记录到当前回放位置
            moveHistory = moveHistory.slice(0, replayStep);

            // 切换到正常模式
            isReplayMode = false;
            isHistoryGame = false;
            gameOver = false;
            currentGameId = generateUniqueId();
            gameStartTime = Date.now();

            document.getElementById('replayControls').classList.remove('show');
            document.getElementById('undoBtn').disabled = moveHistory.length === 0;
            document.getElementById('winnerMessage').textContent = '';
            document.getElementById('winnerMessage').className = 'winner-message';

            updatePlayerDisplay();
            saveCurrentGame();
            updateWinratePanel();
            requestWinrate();

            // 从回放分支继续时，若当前该 AI 行棋则接手
            makeAIMove();
        }

        function handleClick(e) {
            if (gameOver || isReplayMode) return;

            // 检查当前玩家是否为 AI（如果是，不响应点击）
            const currentPlayerNum = (currentPlayer === 1 && blackPlayer === 1) || (currentPlayer === 2 && blackPlayer === 2) ? 1 : 2;
            const isAI = currentPlayerNum === 1 ? player1IsAI : player2IsAI;
            if (isAI) return;

            // 检查姓名
            if (!checkPlayerNames()) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left || e.touches?.[0]?.clientX - rect.left;
            const y = e.clientY - rect.top || e.touches?.[0]?.clientY - rect.top;

            const col = Math.round((x - PADDING) / CELL_SIZE);
            const row = Math.round((y - PADDING) / CELL_SIZE);

            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) {
                return;
            }

            if (board[row][col] !== 0) {
                return;
            }

            // 记录移动历史
            moveHistory.push({row, col, player: currentPlayer});
            document.getElementById('undoBtn').disabled = false;

            // 放置棋子
            board[row][col] = currentPlayer;
            drawPiece(row, col, currentPlayer);

            // 检查胜利
            if (checkWin(row, col, currentPlayer)) {
                gameOver = true;
                const names = getPlayerNames();
                const winnerName = currentPlayer === 1 ? names.blackName : names.whiteName;

                // 保存到历史记录
                saveToHistory();

                // 显示获胜弹窗
                showWinModal(winnerName);
                return;
            }

            // 切换玩家
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updatePlayerDisplay();

            // 保存当前对局状态
            saveCurrentGame();

            // 触发 AI 下棋；若对手是真人则由引擎算一次胜率
            if (isCurrentPlayerAI()) {
                makeAIMove();
            } else {
                requestWinrate();
            }
        }

        function undoMove() {
            if (moveHistory.length === 0 || gameOver || isReplayMode) return;

            const lastMove = moveHistory.pop();
            board[lastMove.row][lastMove.col] = 0;
            currentPlayer = lastMove.player;

            redrawBoard();
            updatePlayerDisplay();

            if (moveHistory.length === 0) {
                document.getElementById('undoBtn').disabled = true;
            }

            // 更新当前对局状态
            saveCurrentGame();

            // 悔棋后作废在途的引擎请求，重新计算胜率
            moveReqId = ++reqSeq;
            analyzeReqId = moveReqId;
            if (moveHistory.length === 0) resetWinrate();
            requestWinrate();
        }

        function restartGame() {
            // 只有当前对局不是从历史记录加载的，且有移动记录时，才保存到历史
            if (!isHistoryGame && moveHistory.length > 0) {
                saveToHistory();
            }

            // 清除 AI 定时器
            if (aiThinkingTimer) {
                clearTimeout(aiThinkingTimer);
                aiThinkingTimer = null;
            }

            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1; // 黑方永远先手
            gameOver = false;
            moveHistory = [];
            currentGameId = generateUniqueId();
            gameStartTime = Date.now();
            isReplayMode = false;
            replayStep = 0;
            isHistoryGame = false;

            document.getElementById('winnerMessage').textContent = '';
            document.getElementById('winnerMessage').className = 'winner-message';
            document.getElementById('undoBtn').disabled = true;
            document.getElementById('replayControls').classList.remove('show');

            // 清空当前对局
            localStorage.removeItem('gobang_current');

            // 作废在途的引擎请求，避免上一局的结果落到新棋盘上
            moveReqId = ++reqSeq;
            analyzeReqId = moveReqId;

            redrawBoard();
            updatePlayerDisplay();
            updateWinratePanel();
            resetWinrate();
        }

        // 保存当前正在进行的对局
        function saveCurrentGame() {
            if (isHistoryGame) return; // 从历史加载的游戏不保存为当前对局

            const names = getPlayerNames();

            const gameData = {
                id: currentGameId,
                startTime: gameStartTime,
                moves: moveHistory,
                currentPlayer: currentPlayer,
                player1Name: player1Name,
                player2Name: player2Name,
                blackPlayer: blackPlayer,
                player1IsAI: player1IsAI,
                player2IsAI: player2IsAI
            };

            localStorage.setItem('gobang_current', JSON.stringify(gameData));
        }

        // 保存到历史记录（只在游戏结束时）
        function saveToHistory() {
            if (moveHistory.length === 0) return;

            const names = getPlayerNames();

            const winner = gameOver ? (moveHistory[moveHistory.length - 1].player) : null;
            const winnerName = winner === 1 ? names.blackName : names.whiteName;

            const date = new Date(gameStartTime);
            const timeStr = `${date.getMonth() + 1}月${date.getDate()}日 ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;

            const gameData = {
                id: currentGameId,
                startTime: gameStartTime,
                endTime: Date.now(),
                moves: moveHistory,
                winner: winner,
                player1Name: player1Name,
                player2Name: player2Name,
                blackPlayer: blackPlayer,
                player1IsAI: player1IsAI,
                player2IsAI: player2IsAI,
                title: `${timeStr} ${names.blackName}先手 ${names.blackName}vs${names.whiteName} ${winner ? winnerName + '赢' : '未完成'}`
            };

            const games = getGameHistory();

            // 检查是否已存在（避免重复保存）
            const existingIndex = games.findIndex(g => g.id === currentGameId);
            if (existingIndex >= 0) {
                games[existingIndex] = gameData;
            } else {
                games.unshift(gameData);
            }

            // 只保留最近 50 局
            if (games.length > 50) {
                games.splice(50);
            }

            localStorage.setItem('gobang_history', JSON.stringify(games));

            // 清空当前对局
            localStorage.removeItem('gobang_current');
        }

        // 获取历史记录
        function getGameHistory() {
            const data = localStorage.getItem('gobang_history');
            return data ? JSON.parse(data) : [];
        }

        // 显示历史记录
        function showHistory() {
            const games = getGameHistory();
            const historyList = document.getElementById('historyList');

            if (games.length === 0) {
                historyList.innerHTML = '<div class="empty-history">暂无历史对局记录</div>';
            } else {
                historyList.innerHTML = games.map((game, index) => {
                    const title = game.title || `对局 ${index + 1}`;

                    return `
                        <div class="history-item">
                            <div class="history-item-header">
                                <span class="history-time">${title}</span>
                            </div>
                            <div class="history-moves">共 ${game.moves.length} 步</div>
                            <div class="history-actions">
                                <button class="btn-small btn-load" onclick="loadGame('${game.id}')">查看回放</button>
                                <button class="btn-small btn-delete" onclick="deleteGame('${game.id}')">删除</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('historyModal').classList.add('show');
        }

        // 关闭历史记录
        function closeHistory() {
            document.getElementById('historyModal').classList.remove('show');
        }

        // 加载游戏（从历史记录，回放模式）
        function loadGame(gameId) {
            const games = getGameHistory();
            const game = games.find(g => g.id === gameId);

            if (!game) return;

            // 保存当前对局（如果需要）
            if (!isHistoryGame && moveHistory.length > 0 && !gameOver) {
                if (confirm('当前有未完成的对局，是否保存？')) {
                    saveToHistory();
                }
            }

            // 停止自动播放
            stopAutoPlay();

            // 清除 AI 定时器
            if (aiThinkingTimer) {
                clearTimeout(aiThinkingTimer);
                aiThinkingTimer = null;
            }

            // 加载历史对局
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            moveHistory = [...game.moves];
            gameOver = !!game.winner;
            currentGameId = game.id;
            gameStartTime = game.startTime;
            isReplayMode = true;
            replayStep = 0; // 从头开始
            isHistoryGame = true;
            blackPlayer = game.blackPlayer || 1;

            player1Name = game.player1Name || '玩家一';
            player2Name = game.player2Name || '玩家二';
            player1IsAI = game.player1IsAI || false;
            player2IsAI = game.player2IsAI || false;

            currentPlayer = 1; // 黑方永远先手

            // 重绘棋盘
            redrawBoard();
            updatePlayerDisplay();

            // 显示回放控制
            document.getElementById('replayControls').classList.add('show');
            document.getElementById('undoBtn').disabled = true;
            updateReplayButtons();

            // 清空获胜消息
            document.getElementById('winnerMessage').textContent = '';
            document.getElementById('winnerMessage').className = 'winner-message';

            updateWinratePanel();
            closeHistory();
        }

        // 删除游戏
        function deleteGame(gameId) {
            if (!confirm('确定要删除这局游戏吗？')) return;

            const games = getGameHistory();
            const filtered = games.filter(g => g.id !== gameId);
            localStorage.setItem('gobang_history', JSON.stringify(filtered));

            showHistory(); // 刷新列表
        }

        // 显示获胜弹窗
        function showWinModal(winnerName) {
            document.getElementById('winModalMessage').textContent = `🎉 ${winnerName}获胜！`;
            document.getElementById('winModal').classList.add('show');
        }

        // 关闭获胜弹窗
        function closeWinModal() {
            document.getElementById('winModal').classList.remove('show');
        }

        // 下一局：沿用当前配置直接开局，要改设置走「设置」按钮
        function nextGame() {
            closeWinModal();
            startNewGame();
        }

        // 查看回放
        function viewReplay() {
            closeWinModal();

            // 进入回放模式
            isReplayMode = true;
            replayStep = 0;
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;

            redrawBoard();
            updatePlayerDisplay();

            // 显示回放控制
            document.getElementById('replayControls').classList.add('show');
            document.getElementById('undoBtn').disabled = true;
            updateReplayButtons();
            updateWinratePanel();
        }

        // 事件监听
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleClick(e);
        });

        // 响应式调整
        window.addEventListener('resize', () => {
            location.reload(); // 简单处理：重新加载页面以重新计算尺寸
        });

        // 加载当前正在进行的对局
        function loadCurrentGame() {
            const data = localStorage.getItem('gobang_current');
            if (!data) return false;

            try {
                const game = JSON.parse(data);

                // 重置棋盘
                board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
                moveHistory = game.moves;
                currentPlayer = game.currentPlayer;
                currentGameId = game.id;
                gameStartTime = game.startTime;
                gameOver = false;
                isReplayMode = false;
                isHistoryGame = false;
                blackPlayer = game.blackPlayer || 1;

                player1Name = game.player1Name || '';
                player2Name = game.player2Name || '';
                player1IsAI = game.player1IsAI || false;
                player2IsAI = game.player2IsAI || false;

                // 重播所有棋子
                moveHistory.forEach(move => {
                    board[move.row][move.col] = move.player;
                });

                // 重绘棋盘
                redrawBoard();

                // 更新界面
                updatePlayerDisplay();
                document.getElementById('undoBtn').disabled = moveHistory.length === 0;

                return true;
            } catch (e) {
                console.error('加载游戏失败', e);
                return false;
            }
        }

        // 初始化
        function initGame() {
            // 先读设置，面板的显示状态依赖它
            loadSettings();

            // 尝试加载当前对局
            const loaded = loadCurrentGame();
            let needSetup = false;

            if (!loaded) {
                // 尝试加载上次的玩家姓名和 AI 设置
                const savedNames = localStorage.getItem('gobang_player_names');
                if (savedNames) {
                    try {
                        const names = JSON.parse(savedNames);
                        player1Name = names.player1Name || '';
                        player2Name = names.player2Name || '';
                        blackPlayer = names.blackPlayer || 1;
                        player1IsAI = names.player1IsAI || false;
                        player2IsAI = names.player2IsAI || false;
                    } catch (e) {
                        player1Name = '';
                        player2Name = '';
                        blackPlayer = 1;
                        player1IsAI = false;
                        player2IsAI = false;
                    }
                }

                // 没有当前对局，开始新游戏
                currentGameId = generateUniqueId();
                gameStartTime = Date.now();
                drawBoard();
                updatePlayerDisplay();
                document.getElementById('undoBtn').disabled = true;

                needSetup = !player1Name || !player2Name;
            }

            // 待生效的先手跟随当前局，避免开新局时把先手意外改掉。
            // 必须在弹出设置之前赋值，否则弹窗里的先手项读到的是初始值。
            pendingBlackPlayer = blackPlayer;

            // 面板状态与胜率初值
            updateWinratePanel();
            resetWinrate();

            // 首次访问没有姓名，引导去设置里填
            if (needSetup) showSettings();

            // 续上的对局若轮到 AI 行棋，接手；否则按需算一次胜率
            if (isCurrentPlayerAI()) {
                setTimeout(makeAIMove, 400);
            } else {
                requestWinrate();
            }
        }

        initGame();
    </script>
    <script>
        // 离线缓存：注册 pages/ 共享 Service Worker，使断网后仍可访问本页
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[pages-cache] SW 已注册，作用域:', reg.scope))
                    .catch(err => console.warn('[pages-cache] SW 注册失败:', err));
            });
        }
    </script>
</body>
